services:
  fluid-network:
    build: .
    command: ["python", "backend_server.py", "--port", "8080"]
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  fluid-network-api:
    build: .
    command: ["python", "backend_server.py"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
