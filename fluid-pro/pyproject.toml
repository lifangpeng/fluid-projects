[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluid-network"
version = "0.1.0"
description = "Steady-state fluid network solver and analysis toolkit"
requires-python = ">=3.11"
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fluid-network = "fluid_network.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
