[meta]
name = "demo-hydraulic-network"
version = "1.0"
[fluid]
density_kg_m3 = 1000.0
[[nodes]]
id="source"
type="source"
pressure_pa=500000.0
[[nodes]]
id="junction"
type="junction"
[[nodes]]
id="cooling"
type="load"
pressure_pa=100000.0
min_flow_m3s=0.0005
min_pressure_pa=100000.0
function="cooling"
[[nodes]]
id="process"
type="load"
pressure_pa=100000.0
min_flow_m3s=0.0003
min_pressure_pa=80000.0
function="process"
[[edges]]
id="main"
from="source"
to="junction"
resistance=2.0e11
model="quadratic"
diameter_m=0.02
[[edges]]
id="cooling_branch"
from="junction"
to="cooling"
resistance=4.0e11
model="quadratic"
diameter_m=0.012
[[edges]]
id="process_branch"
from="junction"
to="process"
resistance=6.0e11
model="quadratic"
diameter_m=0.01
[[controls]]
id="cooling_valve"
kind="valve"
target_ids=["cooling_branch"]
states=["open","closed"]
default="open"
[[scenarios]]
id="normal"
set={cooling_valve="open"}
[[scenarios]]
id="cooling_off"
set={cooling_valve="closed"}
